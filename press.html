  <style>
    /* Press Page Styles */
    .navbar{position:sticky;top:0}
    .press-hero{padding:60px 20px 60px;text-align:center;background:radial-gradient(ellipse at 40% 20%,rgba(220,38,38,0.15) 0%,transparent 50%),radial-gradient(ellipse at 60% 80%,rgba(249,115,22,0.1) 0%,transparent 50%),var(--dark)}
    .press-hero h1{font-size:clamp(2.2rem,5vw,3.5rem);margin-bottom:15px;background:var(--gradient-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .press-hero-sub{font-size:1.15rem;color:var(--gray-light);max-width:700px;margin:0 auto;line-height:1.7}

    .press-content{max-width:920px;margin:0 auto;padding:0 20px 80px}
    .press-section{margin-bottom:60px;padding-top:40px}
    .press-section h2{font-size:1.7rem;margin-bottom:20px;color:var(--accent);display:flex;align-items:center;gap:15px}
    .press-section h2::before{content:"";width:5px;height:28px;background:var(--gradient);border-radius:3px;flex-shrink:0}
    .press-section h3{font-size:1.2rem;margin:25px 0 12px;color:var(--primary-light)}
    .press-section p{color:var(--gray-light);margin-bottom:16px;line-height:1.8}

    /* Press Meta */
    .press-meta{display:flex;gap:20px;align-items:center;margin-bottom:30px;flex-wrap:wrap}
    .press-badge{background:var(--gradient);color:#fff;padding:6px 16px;border-radius:20px;font-size:0.8rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase}
    .press-date{color:var(--gray);font-size:0.9rem}

    /* Comparison Table */
    .compare-table{width:100%;border-collapse:collapse;margin:25px 0;background:var(--dark-light);border-radius:var(--radius-lg);overflow:hidden}
    .compare-table th,.compare-table td{padding:16px 20px;text-align:left;border-bottom:1px solid var(--dark-border)}
    .compare-table th{background:rgba(220,38,38,0.15);color:var(--primary-light);font-weight:600;font-size:0.9rem}
    .compare-table tr:last-child td{border-bottom:none}
    .compare-table tr:hover{background:rgba(220,38,38,0.03)}
    .compare-table .method{color:var(--accent);font-weight:700}
    .compare-table .gap{color:var(--primary-light);font-weight:600}
    .compare-table .yes{color:#4ade80;font-weight:600}
    .compare-table .no{color:var(--gray)}

    /* Quote Block */
    .press-quote{background:var(--dark-lighter);border-radius:var(--radius);padding:25px 30px;margin:25px 0;border-left:4px solid var(--primary)}
    .press-quote p{color:var(--white);font-size:1.05rem;font-style:italic;margin-bottom:8px}
    .press-quote .attr{color:var(--gray);font-size:0.85rem;font-style:normal}

    /* Highlight Box */
    .highlight-box{background:linear-gradient(135deg,rgba(220,38,38,0.08),rgba(249,115,22,0.05));border:1px solid rgba(220,38,38,0.2);border-radius:var(--radius-lg);padding:30px;margin:25px 0}
    .highlight-box h3{color:var(--primary-light);margin-top:0}
    .highlight-box.virtual{border-color:rgba(99,102,241,0.3);background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(0,212,255,0.05))}
    .highlight-box.virtual h3{color:#818cf8}

    /* MNN Code Examples */
    .mnn-code{background:var(--dark-lighter);border-radius:10px;padding:20px 25px;margin:20px 0;font-family:'Courier New',monospace;font-size:0.95rem;border:1px solid rgba(255,255,255,0.08);color:var(--accent);line-height:1.9}
    .mnn-code .label{color:var(--gray-light);font-family:'Inter',sans-serif;font-size:0.85rem;display:block;margin-bottom:8px}
    .mnn-code .note{color:var(--gray);font-family:'Inter',sans-serif;font-size:0.82rem;margin-top:8px;display:block}

    /* Use Case Cards */
    .use-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin:25px 0}
    .use-card{background:var(--dark-light);border-radius:var(--radius-lg);padding:25px;border:1px solid var(--dark-border);transition:var(--transition)}
    .use-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 8px 30px rgba(220,38,38,0.15)}
    .use-card .tag{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--primary-light);margin-bottom:8px}
    .use-card h4{font-size:1.05rem;font-weight:800;margin-bottom:8px}
    .use-card p{color:var(--gray-light);font-size:0.9rem;margin:0;line-height:1.7}

    /* Virtual World section specific */
    .vw-compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}
    .vw-now,.vw-mnn{border-radius:var(--radius-lg);padding:25px;border:1px solid var(--dark-border)}
    .vw-now{background:rgba(115,115,115,0.08);border-color:rgba(115,115,115,0.2)}
    .vw-mnn{background:rgba(220,38,38,0.06);border-color:rgba(220,38,38,0.2)}
    .vw-now h4{color:var(--gray-light);font-size:1rem;margin-bottom:12px}
    .vw-mnn h4{color:var(--primary-light);font-size:1rem;margin-bottom:12px}
    .vw-now p,.vw-mnn p{font-size:0.9rem;color:var(--gray-light);margin-bottom:10px;line-height:1.7}
    .vw-now p:last-child,.vw-mnn p:last-child{margin-bottom:0}

    /* IP Notice */
    .ip-notice{background:var(--dark-lighter);border-radius:var(--radius);padding:20px 25px;border:1px solid var(--dark-border);font-size:0.85rem;color:var(--gray);line-height:1.7;margin:30px 0}
    .ip-notice strong{color:var(--gray-light)}

    /* Footer */
    .press-footer{background:var(--dark-light);padding:40px 20px;text-align:center;border-top:1px solid var(--dark-border)}
    .press-footer p{color:var(--gray-light);font-size:0.9rem}.press-footer a{color:var(--primary-light);text-decoration:none}

    @media(max-width:768px){
      .vw-compare{grid-template-columns:1fr}
      .use-grid{grid-template-columns:1fr}
    }
  </style>
