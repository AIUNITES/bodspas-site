<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodWave — Mind-Neuro-Muscle Notation | BodSpas</title>
  <meta name="description" content="BodWave is powered by MNN (Mind-Neuro-Muscle Notation) — a written system for mind-muscle connection. It tells you exactly which muscle to focus on, how hard to contract, and when. From basic flexing to full-body wave control.">
  <meta name="keywords" content="BodWave, MNN, mind-neuro-muscle notation, mind muscle connection, muscle focus, muscle control, muscle isolation, motor unit recruitment, body wave control, bodybuilding notation, workout notation">
  <meta name="author" content="BodSpas / AIUNITES">
  <meta property="og:title" content="BodWave — Mind-Neuro-Muscle Notation">
  <meta property="og:description" content="A written system for mind-muscle connection. MNN tells you exactly which muscle to focus on, how hard to contract, and when. No devices — just notation for your nervous system.">
  <meta property="og:type" content="article">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* BodWave Page Overrides */
    .navbar{position:sticky;top:0}
    .mw-hero{padding:60px 20px 60px;text-align:center;background:radial-gradient(ellipse at 40% 20%,rgba(220,38,38,0.15) 0%,transparent 50%),radial-gradient(ellipse at 60% 80%,rgba(249,115,22,0.1) 0%,transparent 50%),var(--dark)}
    .mw-hero h1{font-size:clamp(2.4rem,5vw,3.8rem);margin-bottom:15px;background:var(--gradient-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .mw-hero-sub{font-size:1.15rem;color:var(--gray-light);max-width:720px;margin:0 auto 30px;line-height:1.7}
    .mw-stats{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:25px}
    .mw-stat{text-align:center}
    .mw-stat .num{font-size:2.2rem;font-weight:900;background:var(--gradient-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .mw-stat .label{font-size:0.85rem;color:var(--gray)}

    .mw-content{max-width:920px;margin:0 auto;padding:0 20px 80px}
    .mw-section{margin-bottom:60px;padding-top:40px}
    .mw-section h2{font-size:1.7rem;margin-bottom:20px;color:var(--accent);display:flex;align-items:center;gap:15px}
    .mw-section h2::before{content:"";width:5px;height:28px;background:var(--gradient);border-radius:3px;flex-shrink:0}
    .mw-section h3{font-size:1.2rem;margin:25px 0 12px;color:var(--primary-light)}
    .mw-section h4{font-size:1.05rem;margin:22px 0 10px;color:var(--secondary);font-weight:700}
    .mw-section p{color:var(--gray-light);margin-bottom:16px;line-height:1.8}

    /* Nerve-Muscle Cards */
    .muscle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin:25px 0}
    .muscle-card{background:var(--dark-light);border-radius:var(--radius-lg);padding:25px;border:1px solid var(--dark-border);transition:var(--transition)}
    .muscle-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 8px 30px rgba(220,38,38,0.15)}
    .muscle-group{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--primary-light);margin-bottom:8px}
    .muscle-card h4{font-size:1.1rem;font-weight:800;margin-bottom:8px}
    .muscle-card p{color:var(--gray-light);font-size:0.9rem;margin:0 0 10px}
    .muscle-nerve{font-family:'Courier New',monospace;color:var(--accent);font-size:0.85rem;background:rgba(251,191,36,0.06);padding:6px 10px;border-radius:6px;display:block;margin-top:8px}

    /* BodWave Scale */
    .mw-scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:25px 0}
    .mw-level{border-radius:var(--radius-lg);padding:25px;border:1px solid var(--dark-border);text-align:center;transition:var(--transition)}
    .mw-level:hover{transform:translateY(-3px)}
    .mw-level .lvl{font-size:2rem;font-weight:900;margin-bottom:6px}
    .mw-level h4{font-size:1rem;font-weight:700;margin-bottom:8px}
    .mw-level p{font-size:0.85rem;color:var(--gray-light);margin:0}
    .mw-level.l1{background:linear-gradient(135deg,rgba(220,38,38,0.08),rgba(220,38,38,0.03));border-color:rgba(220,38,38,0.2)}.mw-level.l1 .lvl{color:var(--primary-light)}
    .mw-level.l2{background:linear-gradient(135deg,rgba(249,115,22,0.08),rgba(249,115,22,0.03));border-color:rgba(249,115,22,0.2)}.mw-level.l2 .lvl{color:var(--secondary)}
    .mw-level.l3{background:linear-gradient(135deg,rgba(251,191,36,0.08),rgba(251,191,36,0.03));border-color:rgba(251,191,36,0.2)}.mw-level.l3 .lvl{color:var(--accent)}
    .mw-level.l4{background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(251,191,36,0.05));border-color:rgba(251,191,36,0.3)}.mw-level.l4 .lvl{background:var(--gradient-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    /* Mapping Table */
    .mw-table{width:100%;border-collapse:collapse;margin:20px 0;background:var(--dark-light);border-radius:var(--radius-lg);overflow:hidden}
    .mw-table th,.mw-table td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--dark-border)}
    .mw-table th{background:rgba(220,38,38,0.15);color:var(--primary-light);font-weight:600;font-size:0.9rem}
    .mw-table tr:last-child td{border-bottom:none}
    .mw-table tr:hover{background:rgba(220,38,38,0.03)}
    .mw-table .nerve{color:var(--secondary);font-weight:600}
    .mw-table .muscle{color:var(--accent);font-family:'Courier New',monospace}

    /* Quote */
    .mw-quote{background:var(--dark-lighter);border-radius:var(--radius);padding:25px 30px;margin:25px 0;border-left:4px solid var(--primary)}
    .mw-quote p{color:var(--white);font-size:1.05rem;font-style:italic;margin-bottom:8px}
    .mw-quote .attr{color:var(--gray);font-size:0.85rem;font-style:normal}

    /* Connection Box */
    .connect-box{background:linear-gradient(135deg,rgba(220,38,38,0.08),rgba(249,115,22,0.05));border:1px solid rgba(220,38,38,0.2);border-radius:var(--radius-lg);padding:30px;margin:25px 0}
    .connect-box h3{color:var(--primary-light);margin-top:0}

    /* Chain */
    .nerve-chain{display:flex;align-items:center;gap:0;margin:30px 0;flex-wrap:wrap;justify-content:center}
    .nc-step{background:var(--dark-light);border:1px solid var(--dark-border);border-radius:var(--radius);padding:16px 20px;text-align:center;min-width:130px;transition:var(--transition)}
    .nc-step:hover{border-color:var(--primary)}
    .nc-step .icon{font-size:1.6rem;margin-bottom:4px}
    .nc-step .name{font-size:0.85rem;font-weight:700}
    .nc-step .desc{font-size:0.72rem;color:var(--gray);margin-top:3px}
    .nc-arrow{color:var(--primary-light);font-size:1.5rem;padding:0 6px;flex-shrink:0}

    /* IP Notice */
    .ip-notice{background:var(--dark-lighter);border-radius:var(--radius);padding:20px 25px;border:1px solid var(--dark-border);font-size:0.85rem;color:var(--gray);line-height:1.7;margin:30px 0}
    .ip-notice strong{color:var(--gray-light)}

    /* CTA */
    .mw-cta{text-align:center;padding:50px 20px;background:radial-gradient(ellipse at 50% 50%,rgba(220,38,38,0.1) 0%,transparent 60%);border-radius:var(--radius-lg);margin:40px 0}
    .mw-cta h2{justify-content:center;font-size:1.9rem}
    .mw-cta h2::before{display:none}
    .mw-cta-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:25px}
    .mw-cta-links a{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:var(--radius);text-decoration:none;font-weight:700;font-size:1rem;transition:transform 0.2s;color:#fff}
    .mw-cta-links a:hover{transform:translateY(-3px)}
    .btn-red{background:var(--gradient);box-shadow:0 4px 20px rgba(220,38,38,0.3)}
    .btn-orange{background:linear-gradient(135deg,var(--secondary),var(--accent));color:#000!important;box-shadow:0 4px 20px rgba(249,115,22,0.25)}

    /* Footer */
    .mw-footer{background:var(--dark-light);padding:40px 20px;text-align:center;border-top:1px solid var(--dark-border)}
    .mw-footer p{color:var(--gray-light);font-size:0.9rem}.mw-footer a{color:var(--primary-light);text-decoration:none}

    @media(max-width:768px){
      .muscle-grid{grid-template-columns:1fr}
      .mw-scale{grid-template-columns:1fr 1fr}
      .nerve-chain{flex-direction:column}.nc-arrow{transform:rotate(90deg)}
      .mw-stats{gap:15px}
    }
  </style>
